name: Check a handle or name (test)

# Results are NOT printed to the public log. The report is saved as a private-ish
# artifact kept for 1 day so the reviewer can read it before anything is shared.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Handle (with or without @) or full name"
        required: true
      name:
        description: "Optional public business or brand name to also check"
        required: false
      label:
        description: "Short label for the report file"
        required: false
        default: "report"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run checks (output kept out of the log)
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          Q: ${{ inputs.query }}
          N: ${{ inputs.name }}
          L: ${{ inputs.label }}
        run: |
          cd lookup
          set +e
          if [ -n "$N" ]; then python check.py --query "$Q" --name "$N" --out "$L" > "$L.log" 2>&1; else python check.py --query "$Q" --out "$L" > "$L.log" 2>&1; fi
          echo "finished with exit code $?"
          # Encrypt the report so the public log only ever shows scrambled text
          cat "$L.md" "$L.log" > bundle.txt 2>/dev/null || true
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in bundle.txt -out bundle.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey report_key.pub -in k.txt -out k.enc
          echo "===KEY===";  base64 -w0 k.enc; echo
          echo "===DATA==="; base64 -w0 bundle.enc; echo
          echo "===END==="
          rm -f k.txt bundle.txt
